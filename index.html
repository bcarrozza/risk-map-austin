<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Austin, Texas — Directional Environmental Risk Plume Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css" />
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #map { height: 100vh; width: 100%; }
        .top-info {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            padding: 8px 14px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            max-width: 340px;
            font-size: 14px;
            line-height: 1.4;
        }
        .top-info h1 {
            margin: 0 0 4px 0;
            font-size: 18px;
            color: #222;
        }
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            max-width: 240px;
            font-size: 13px;
        }
        .legend h3 { margin: 0 0 8px 0; font-size: 15px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 6px; }
        .legend-color {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            border-radius: 3px;
            border: 1px solid #555;
        }
        .plume-note {
            font-size: 12px;
            color: #444;
            margin-top: 10px;
            line-height: 1.3;
        }
        .risk-popup h4 { margin: 0 0 8px 0; }
        .risk-item { padding: 4px 0; border-bottom: 1px solid #eee; }
        .risk-item:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="top-info">
        <h1>Austin, Texas</h1>
        <p><strong>Directional Environmental Risk Plume Map</strong><br>
        Search any address to see which risk plumes it intersects.<br>
        Prevailing southerly winds carry pollution <strong>northward 75% of the year</strong>.</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>
    <script>
        /**
         * Complete self-contained Leaflet map for Austin, TX directional environmental risk plumes.
         * Uses exact JSON configuration provided.
         * Directional plumes generated with custom offset math (primary = North, secondary = South).
         * All features required are implemented.
         * Ready to save as index.html and open in any browser.
         */

        // === EMBEDDED CITY DATA (exact copy of provided JSON) ===
        const cityData = {
            "cityName": "Austin",
            "state": "Texas",
            "mapCenter": [30.2672, -97.7431],
            "initialZoom": 11,
            "prevailingWinds": {
                "primaryDirection": "N",
                "primaryPct": 75,
                "secondaryDirection": "S",
                "secondaryPct": 18,
                "notes": "Prevailing southerly/SSE winds most of the year; weaker northerly winds in winter. Night/early morning inversions can worsen exposure."
            },
            "riskCategories": [
                {
                    "id": "industrial",
                    "name": "Industrial/chemical facilities or solvent-emitting sites",
                    "color": "#ff0000",
                    "plumeDistances": { "primaryMi": 8, "secondaryMi": 2, "crosswindMi": 3 }
                },
                {
                    "id": "highways",
                    "name": "Major highways and high-traffic roadways",
                    "color": "#ff8800",
                    "plumeDistances": { "primaryMi": 0.3, "secondaryMi": 0.15, "crosswindMi": 0.1 }
                },
                {
                    "id": "golf",
                    "name": "Golf courses",
                    "color": "#00aa00",
                    "plumeDistances": { "primaryMi": 3, "secondaryMi": 1, "crosswindMi": 1.5 }
                },
                {
                    "id": "datacenters",
                    "name": "Data centers",
                    "color": "#aa00aa",
                    "plumeDistances": { "primaryMi": 2, "secondaryMi": 1, "crosswindMi": 1 }
                },
                {
                    "id": "airport",
                    "name": "Major airport and immediate flight paths",
                    "color": "#0088ff",
                    "plumeDistances": { "primaryMi": 5, "secondaryMi": 3, "crosswindMi": 3.5 }
                }
            ],
            "sources": {
                "industrial": [
                    {"name": "Alliance Chemicals Taylor", "lat": 30.5700, "lng": -97.4100, "type": "point"},
                    {"name": "Texaco Chemical Co Austin Labs", "lat": 30.3300, "lng": -97.7100, "type": "point"},
                    {"name": "Clean Earth Austin Hazardous Waste", "lat": 30.3100, "lng": -97.6500, "type": "point"},
                    {"name": "Samsung Taylor Industrial Zone", "lat": 30.5500, "lng": -97.4200, "type": "point"},
                    {"name": "East Austin Legacy Tank Farm Site", "lat": 30.2600, "lng": -97.7000, "type": "point"},
                    {"name": "Taylor Industrial Park Solvent Site", "lat": 30.5800, "lng": -97.4000, "type": "point"},
                    {"name": "North Lamar Industrial Facility", "lat": 30.3500, "lng": -97.7000, "type": "point"},
                    {"name": "Montopolis East Austin Industrial Zone", "lat": 30.2300, "lng": -97.6900, "type": "point"}
                ],
                "highways": [
                    {"name": "I-35 Corridor (North-South)", "type": "line", "coordinates": [[30.4500, -97.7000], [30.4000, -97.7000], [30.3500, -97.7000], [30.3000, -97.7000], [30.2500, -97.7000], [30.2000, -97.7000], [30.1500, -97.7000]]},
                    {"name": "Mopac Loop 1 (West Side)", "type": "line", "coordinates": [[30.4000, -97.7800], [30.3500, -97.7800], [30.3000, -97.7800], [30.2500, -97.7800], [30.2000, -97.7800]]},
                    {"name": "US 183 Corridor", "type": "line", "coordinates": [[30.4000, -97.6800], [30.3500, -97.6800], [30.3000, -97.6800], [30.2500, -97.6800]]},
                    {"name": "SH 71 East-West", "type": "line", "coordinates": [[30.2500, -97.8000], [30.2200, -97.7500], [30.2000, -97.7100]]},
                    {"name": "I-35 South Extension", "type": "line", "coordinates": [[30.2000, -97.7000], [30.1500, -97.7000], [30.1000, -97.7000]]},
                    {"name": "Loop 360 (Capital of Texas Hwy)", "type": "line", "coordinates": [[30.3500, -97.8000], [30.3000, -97.8100], [30.2500, -97.8200]]},
                    {"name": "SH 130 Toll (East Bypass)", "type": "line", "coordinates": [[30.4500, -97.6000], [30.4000, -97.6000], [30.3500, -97.6000], [30.3000, -97.6000]]},
                    {"name": "US 290 East", "type": "line", "coordinates": [[30.3000, -97.6500], [30.2500, -97.6500], [30.2200, -97.6500]]}
                ],
                "golf": [
                    {"name": "Avery Ranch Golf Club", "lat": 30.5038, "lng": -97.7696, "type": "point"},
                    {"name": "Jimmy Clay Golf Course", "lat": 30.1853, "lng": -97.7323, "type": "point"},
                    {"name": "Lions Municipal Golf Course", "lat": 30.2922, "lng": -97.7811, "type": "point"},
                    {"name": "Barton Creek Country Club", "lat": 30.2848, "lng": -97.8561, "type": "point"},
                    {"name": "Balcones Country Club", "lat": 30.4407, "lng": -97.7834, "type": "point"},
                    {"name": "Falconhead Golf Club", "lat": 30.3202, "lng": -97.9690, "type": "point"},
                    {"name": "Morris Williams Golf Course", "lat": 30.2883, "lng": -97.6920, "type": "point"},
                    {"name": "Riverside Golf Course", "lat": 30.2374, "lng": -97.7044, "type": "point"},
                    {"name": "Roy Kizer Golf Course", "lat": 30.1850, "lng": -97.7330, "type": "point"}
                ],
                "datacenters": [
                    {"name": "Sabey SDC Austin Round Rock", "lat": 30.5080, "lng": -97.6470, "type": "point"},
                    {"name": "Switch Round Rock East Campus", "lat": 30.5200, "lng": -97.6500, "type": "point"},
                    {"name": "Samsung Taylor Data Center Zone", "lat": 30.5500, "lng": -97.4200, "type": "point"},
                    {"name": "Blueprint Taylor AI Data Center", "lat": 30.5600, "lng": -97.4100, "type": "point"},
                    {"name": "Data Foundry Austin Facility", "lat": 30.2200, "lng": -97.7200, "type": "point"},
                    {"name": "CyrusOne AUS3 Austin", "lat": 30.4000, "lng": -97.7500, "type": "point"},
                    {"name": "South Austin Data Center Campus", "lat": 30.1500, "lng": -97.8000, "type": "point"},
                    {"name": "Pflugerville Area Data Center", "lat": 30.4500, "lng": -97.6200, "type": "point"}
                ],
                "airport": [
                    {"name": "Austin-Bergstrom International Airport (AUS)", "lat": 30.1945, "lng": -97.6699, "type": "point"},
                    {"name": "AUS North Runway/Flight Path", "type": "line", "coordinates": [[30.1945, -97.6699], [30.3000, -97.6700], [30.3500, -97.6700]]},
                    {"name": "AUS South Departure Path", "type": "line", "coordinates": [[30.1945, -97.6699], [30.1000, -97.6700], [30.0500, -97.6700]]},
                    {"name": "AUS East Crosswind Path", "type": "line", "coordinates": [[30.1945, -97.6699], [30.2000, -97.6000]]},
                    {"name": "AUS West Approach Path", "type": "line", "coordinates": [[30.1945, -97.6699], [30.1900, -97.7500]]},
                    {"name": "AUS Primary Runway Extension North", "type": "line", "coordinates": [[30.1945, -97.6699], [30.2200, -97.6700]]},
                    {"name": "AUS Primary Runway Extension South", "type": "line", "coordinates": [[30.1945, -97.6699], [30.1700, -97.6700]]},
                    {"name": "AUS Cargo/Flight Path Extension", "type": "line", "coordinates": [[30.1945, -97.6699], [30.1800, -97.6500], [30.1700, -97.6300]]}
                ]
            }
        };

        // Initialize map
        const map = L.map('map', { zoomControl: true }).setView(cityData.mapCenter, cityData.initialZoom);

        // Base tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        // Leaflet Geocoder (Nominatim - no key needed)
        const geocoderControl = L.Control.geocoder({
            defaultMarkGeocode: false,
            placeholder: 'Search any Austin address...',
            position: 'topright',
            geocoder: L.Control.Geocoder.nominatim({
                geocodingQueryParams: { countrycodes: 'us', limit: 1 }
            })
        }).addTo(map);

        // Global storage for plume data (used for address intersection checks)
        let allPlumes = [];

        // Earth radius in miles for offset calculations
        const EARTH_RADIUS_MI = 3958.8;

        /**
         * Offset a lat/lng point by distance (miles) and bearing (degrees)
         * Bearing: 0 = North, 90 = East, 180 = South, 270 = West
         */
        function offsetLatLng(lat, lng, distanceMi, bearingDeg) {
            const d = distanceMi / EARTH_RADIUS_MI;
            const lat1 = lat * Math.PI / 180;
            const lon1 = lng * Math.PI / 180;
            const brng = bearingDeg * Math.PI / 180;

            const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brng));
            const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(d) * Math.cos(lat1),
                                           Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));

            return [lat2 * 180 / Math.PI, lon2 * 180 / Math.PI];
        }

        /**
         * Create a tapered directional plume polygon (trapezoid / teardrop style)
         * @param {number} lat - source latitude
         * @param {number} lng - source longitude
         * @param {number} lengthMi - length of plume
         * @param {number} bearingDeg - direction (0 = North)
         * @param {number} baseWidthMi - width at source
         * @param {string} color - fill color
         * @param {number} opacity - fill opacity
         * @returns {L.Polygon}
         */
        function createDirectionalPlume(lat, lng, lengthMi, bearingDeg, baseWidthMi, color, opacity) {
            const points = [];
            const steps = 12;
            for (let i = 0; i <= steps; i++) {
                const progress = i / steps;
                const distAlong = lengthMi * progress;
                const center = offsetLatLng(lat, lng, distAlong, bearingDeg);

                // Taper width from baseWidth at source to near-zero at tip
                const widthAtPoint = baseWidthMi * (1 - progress * 0.85);

                // Perpendicular offsets (left = bearing - 90, right = bearing + 90)
                const left = offsetLatLng(center[0], center[1], widthAtPoint / 2, (bearingDeg + 270) % 360);
                const right = offsetLatLng(center[0], center[1], widthAtPoint / 2, (bearingDeg + 90) % 360);

                if (i === 0) {
                    points.push(left);
                }
                points.push(right);
            }
            // Close the polygon by adding left side in reverse
            for (let i = steps; i >= 0; i--) {
                const progress = i / steps;
                const distAlong = lengthMi * progress;
                const center = offsetLatLng(lat, lng, distAlong, bearingDeg);
                const widthAtPoint = baseWidthMi * (1 - progress * 0.85);
                const left = offsetLatLng(center[0], center[1], widthAtPoint / 2, (bearingDeg + 270) % 360);
                points.push(left);
            }
            const polygon = L.polygon(points, {
                color: color,
                weight: 1,
                opacity: 0.6,
                fillColor: color,
                fillOpacity: opacity,
                className: 'plume-polygon'
            });
            return polygon;
        }

        // Ray-casting point-in-polygon (for polygon plumes)
        function pointInPolygon(point, vs) {
            const x = point[0], y = point[1];
            let inside = false;
            for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                const xi = vs[i][0], yi = vs[i][1];
                const xj = vs[j][0], yj = vs[j][1];
                const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        // Build all risk layers and plumes
        const overlayLayers = {};

        cityData.riskCategories.forEach(category => {
            const group = L.featureGroup();
            const catSources = cityData.sources[category.id] || [];
            const dist = category.plumeDistances;
            const color = category.color;

            catSources.forEach(source => {
                if (source.type === 'point') {
                    const lat = source.lat;
                    const lng = source.lng;

                    // Primary plume (North - elongated, higher opacity)
                    const primaryPlume = createDirectionalPlume(lat, lng, dist.primaryMi, 0, dist.crosswindMi * 1.8, color, 0.28);
                    primaryPlume.addTo(group);
                    allPlumes.push({
                        layer: primaryPlume,
                        categoryName: category.name,
                        plumeType: 'primary',
                        pct: cityData.prevailingWinds.primaryPct,
                        color: color
                    });

                    // Secondary plume (South)
                    const secondaryPlume = createDirectionalPlume(lat, lng, dist.secondaryMi, 180, dist.crosswindMi * 1.4, color, 0.22);
                    secondaryPlume.addTo(group);
                    allPlumes.push({
                        layer: secondaryPlume,
                        categoryName: category.name,
                        plumeType: 'secondary',
                        pct: cityData.prevailingWinds.secondaryPct,
                        color: color
                    });

                    // Crosswind buffer (circle)
                    const crossRadiusMeters = dist.crosswindMi * 1609.34;
                    const crossCircle = L.circle([lat, lng], {
                        radius: crossRadiusMeters,
                        color: color,
                        weight: 1,
                        opacity: 0.5,
                        fillColor: color,
                        fillOpacity: 0.12
                    }).addTo(group);
                    allPlumes.push({
                        layer: crossCircle,
                        categoryName: category.name,
                        plumeType: 'crosswind',
                        pct: 100,
                        color: color,
                        isCircle: true,
                        center: [lat, lng],
                        radiusMi: dist.crosswindMi
                    });

                    // Source marker
                    const marker = L.circleMarker([lat, lng], {
                        radius: 6,
                        color: '#222',
                        fillColor: color,
                        fillOpacity: 1,
                        weight: 2
                    }).addTo(group);
                    marker.bindPopup(`<b>${source.name}</b><br><small>${category.name}<br>Point source</small>`);

                } else if (source.type === 'line') {
                    // For line sources (highways / flight paths): draw the line + approximate directional buffer
                    const lineCoords = source.coordinates.map(coord => [coord[0], coord[1]]);
                    const polyline = L.polyline(lineCoords, {
                        color: color,
                        weight: 6,
                        opacity: 0.75
                    }).addTo(group);

                    polyline.bindPopup(`<b>${source.name}</b><br><small>${category.name}<br>Line source — directional plumes approximated along path</small>`);

                    // Sample points along the line and add small directional plumes + crosswind
                    const sampleInterval = Math.max(0.4, dist.primaryMi / 6); // adaptive sampling
                    for (let i = 0; i < lineCoords.length - 1; i++) {
                        const start = lineCoords[i];
                        const end = lineCoords[i + 1];
                        const samples = 3;
                        for (let s = 0; s <= samples; s++) {
                            const fraction = s / samples;
                            const sampleLat = start[0] + (end[0] - start[0]) * fraction;
                            const sampleLng = start[1] + (end[1] - start[1]) * fraction;

                            // Small primary plume along line (North)
                            const smallPrimary = createDirectionalPlume(sampleLat, sampleLng, dist.primaryMi * 0.4, 0, dist.crosswindMi * 0.8, color, 0.18);
                            smallPrimary.addTo(group);
                            allPlumes.push({ layer: smallPrimary, categoryName: category.name, plumeType: 'primary', pct: cityData.prevailingWinds.primaryPct, color: color });

                            // Small secondary
                            const smallSecondary = createDirectionalPlume(sampleLat, sampleLng, dist.secondaryMi * 0.4, 180, dist.crosswindMi * 0.6, color, 0.14);
                            smallSecondary.addTo(group);
                            allPlumes.push({ layer: smallSecondary, categoryName: category.name, plumeType: 'secondary', pct: cityData.prevailingWinds.secondaryPct, color: color });

                            // Crosswind circle (small)
                            const smallCross = L.circle([sampleLat, sampleLng], {
                                radius: dist.crosswindMi * 800,
                                color: color,
                                weight: 1,
                                opacity: 0.4,
                                fillOpacity: 0.09
                            }).addTo(group);
                            allPlumes.push({
                                layer: smallCross,
                                categoryName: category.name,
                                plumeType: 'crosswind',
                                pct: 100,
                                color: color,
                                isCircle: true,
                                center: [sampleLat, sampleLng],
                                radiusMi: dist.crosswindMi * 0.5
                            });
                        }
                    }
                }
            });

            overlayLayers[category.name] = group;
        });

        // Add layer control
        L.control.layers(null, overlayLayers, {
            collapsed: false,
            position: 'topleft'
        }).addTo(map);

        // Add all groups to map by default
        Object.values(overlayLayers).forEach(group => group.addTo(map));

        // Legend
        const legendHTML = `
            <div class="legend">
                <h3>Risk Plumes</h3>
                ${cityData.riskCategories.map(cat => `
                    <div class="legend-item">
                        <div class="legend-color" style="background: ${cat.color};"></div>
                        <span>${cat.name}</span>
                    </div>
                `).join('')}
                <div class="plume-note">
                    <strong>Plume Legend:</strong><br>
                    • Solid elongated = primary (North) ${cityData.prevailingWinds.primaryPct}% of year<br>
                    • Medium elongated = secondary (South) ${cityData.prevailingWinds.secondaryPct}% of year<br>
                    • Faded circle = crosswind buffer<br>
                    ${cityData.prevailingWinds.notes}
                </div>
            </div>`;
        const legendContainer = document.createElement('div');
        legendContainer.innerHTML = legendHTML;
        map.getContainer().appendChild(legendContainer.firstElementChild);

        // Address search handler
        geocoderControl.on('markgeocode', function(e) {
            const latlng = e.geocode.center;
            const address = e.geocode.name || 'Selected location';

            // Remove previous marker
            if (currentMarker) map.removeLayer(currentMarker);

            // Add new marker
            currentMarker = L.marker(latlng, {
                icon: L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="background:#222;color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:18px;">📍</div>`,
                    iconSize: [24, 24]
                })
            }).addTo(map);

            map.flyTo(latlng, 14, { duration: 1.2 });

            // Determine intersecting plumes
            let intersecting = [];

            allPlumes.forEach(plume => {
                const pt = [latlng.lat, latlng.lng];
                let isInside = false;

                if (plume.isCircle) {
                    // Circle check
                    const distanceMi = map.distance(plume.center, latlng) / 1609.34;
                    if (distanceMi <= plume.radiusMi) isInside = true;
                } else if (plume.layer.getLatLngs) {
                    // Polygon check
                    const latlngs = plume.layer.getLatLngs()[0] || plume.layer.getLatLngs();
                    const polyPoints = latlngs.map(ll => [ll.lat, ll.lng]);
                    isInside = pointInPolygon(pt, polyPoints);
                }

                if (isInside) {
                    intersecting.push({
                        category: plume.categoryName,
                        type: plume.plumeType,
                        pct: plume.pct
                    });
                }
            });

            // Build popup content
            let popupHTML = `
                <div class="risk-popup">
                    <h4>${address}</h4>
                    <p><strong>Risk plume intersections:</strong></p>`;

            if (intersecting.length === 0) {
                popupHTML += `<p style="color:#28a745;font-weight:600;">✅ No major risk plumes detected at this location.</p>`;
            } else {
                popupHTML += `<div style="max-height:220px;overflow-y:auto;">`;
                intersecting.forEach(risk => {
                    popupHTML += `
                        <div class="risk-item">
                            <span style="display:inline-block;width:18px;height:18px;background:${cityData.riskCategories.find(c => c.name === risk.category).color};border-radius:3px;vertical-align:middle;margin-right:6px;"></span>
                            <strong>${risk.category}</strong><br>
                            <small>${risk.type.toUpperCase()} plume • ${risk.pct}% of year</small>
                        </div>`;
                });
                popupHTML += `</div>`;
            }

            popupHTML += `<small style="color:#666;display:block;margin-top:12px;">${cityData.prevailingWinds.notes}<br>Plume data is directional and approximate.</small></div>`;

            currentMarker.bindPopup(popupHTML, { maxWidth: 320, className: 'custom-popup' }).openPopup();
        });

        // Optional: click anywhere to clear marker (but keep layers)
        map.on('click', function() {
            if (currentMarker) {
                map.removeLayer(currentMarker);
                currentMarker = null;
            }
        });

        console.log('%c✅ Austin Directional Risk Plume Map initialized successfully', 'color:#00aa00;font-weight:bold');
    </script>
</body>
</html>
